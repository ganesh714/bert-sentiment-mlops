version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./model_output:/app/model_output # Mount model output for easier updates without rebuilds (optional, but good for dev)
    environment:
      - MODEL_PATH=${MODEL_PATH:-/app/model_output}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      - API_URL=${API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
